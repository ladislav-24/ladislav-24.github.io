<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#282828">
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
    {{ with site.Home.OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell nav-wrap">
        <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
          <span class="prompt" aria-hidden="true">~/</span>{{ site.Title }}<span class="cursor" aria-hidden="true">_</span>
        </a>
        <nav aria-label="Main navigation">
          {{ range site.Menus.main }}
            <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          {{ end }}
        </nav>
      </div>
    </header>

    <main id="main" class="shell">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer shell">
      <span>© {{ now.Year }} {{ site.Params.author }}</span>
      <span>Built with <a href="https://gohugo.io/">Hugo</a></span>
    </footer>
  </body>
</html>
